<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sender Pro</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#25D366">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SenderPro">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="email-theme">
    <div class="container">
        <div class="card">
            <div class="header-section">
                <h2>Email Sender</h2>
                <p>Generate personalized bulk emails.</p>
            </div>
            <div class="guide-box">
                Placeholders:
            </div>
           <div class="placeholder-tags">
    <span class="tag">@name</span>
    <span class="tag">@phone</span>
    <span class="tag">@email</span>
    <span class="tag">@address</span>
    <span class="tag">@company</span>
    <span class="tag">@interest</span>
    <span class="tag">@date</span>
    <span class="tag">@other</span>
</div>
            <div class="input-group">
                <label>CSV Data</label>
                <input type="file" id="csvFile" accept=".csv">
            </div>
            <div class="input-group">
                <label>Subject</label>
                <input type="text" id="subjectBox" placeholder="Meeting about @interest for @company">
            </div>
            <div class="input-group">
                <label>Body</label>
                <textarea id="messageBox" placeholder="Hello @name, I am writing regarding @interest..."></textarea>
            </div>
            <button class="btn-primary" onclick="processData()">Generate Drafts</button>
            <center><button onclick="resetApp()" style="margin-top:15px; color:red; background:none; border:none; cursor:pointer;">Clear All</button></center>
        </div>
        <div id="contactList"></div>
    </div>
    <script src="app.js"></script>
    <script src="config.js"></script>
</body>
</html>
